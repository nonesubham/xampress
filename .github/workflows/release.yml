name: Build & Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.2.1)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-Platform Binaries & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build binaries for all platforms
        run: |
          mkdir -p dist

          targets=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/386"
            "darwin/amd64"
            "darwin/arm64"
          )

          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="dist/xampress-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi

            echo "Building ${output}..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "$output" main.go
          done

          cd dist
          sha256sum xampress-* > checksums.txt
          ls -lh

      - name: Determine or auto-increment release tag
        id: meta
        run: |
          git fetch --tags --force
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v0.1.0"
            else
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              MAJOR=${MAJOR:-0}
              MINOR=${MINOR:-1}
              PATCH=${PATCH:-0}
              NEXT_PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi
          echo "Using release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: XamPress ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/xampress-*
            dist/checksums.txt
